<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <title>Task 3</title>
</head>
<body>
    <div class="container p-4">
        <div class="card p-4 mb-4">
            <h2 class="text-center mb-4">CRUD SYSTEM</h2>
            <div class="mb-4">
                <input type="text" class="form-control" id="product-name" placeholder="Product Name">
            </div>
            <div class="mb-4">
                <input type="number" class="form-control" id="product-price" placeholder="Product Price">
            </div>
            <div class="mb-4">
                <input type="text" class="form-control" id="product-categ" placeholder="Product Category">
            </div>
            <div class="mb-4">
                <textarea id="product-description" class="form-control" rows="3" placeholder="Product Description"></textarea>
            </div>
            <div class="mb-4">
                <label for="product-image" class="form-label">Product Image</label>
                <input type="file" class="form-control" id="product-image">
            </div>
            <button id="add-btn" class="btn btn-primary p-3">Add Product</button>
        </div>
        <div class="mb-4">
            <input type="text" id="search-input" class="form-control" placeholder="Search....">
        </div>

        <div>
          <table class="table table-bordered table-striped text-center align-middle">
            <thead class="table-dark">
              <tr>
                <th>Index</th>
                <th>Image</th>
                <th>Name</th>
                <th>Price</th>
                <th>Category</th>
                <th>Description</th>
                <th>Update</th>
                <th>Delete</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/script.js"></script>
</body>
</html>
